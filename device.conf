# device.conf — Nextbit Robin (ether) on lineage-21.0. STAGED from the working 20.0 series: the
# patch series has NOT been rebased onto 21 or built. See README.md.

# ---- identity ----
DEVICE=nextbit/ether
DEVICE_CODENAME=ether
DEVICE_SLUG=ether
VENDOR=nextbit
SOC=msm8992                      # Snapdragon 808; gates options that only suit some hardware

# ---- base ----
BRANCH=lineage-21.0
BASE_REF=m/lineage-21.0
# lineage-20.0 (Android 13) predates the release-config system — build/release does not exist on
# that branch — so the OLD 2-part lunch form is correct here. Do NOT copy the -bp1a form from the
# 22.2 devices.
LUNCH_TARGET=lineage_ether-ap2a-userdebug
MANIFEST_URL=https://github.com/LineageOS/android.git

# ---- build environment (Android 13) ----
UBUNTU_VER=22.04
JDK_VER=11


# ---- projects that carry patches under overlay/patches/ ----
PATCHED_PROJECTS="build/make build/soong device/lineage/sepolicy device/nextbit/ether frameworks/base frameworks/libs/net frameworks/native hardware/qcom-caf/msm8994/display kernel/nextbit/msm8992 packages/modules/adb packages/modules/Bluetooth packages/modules/Connectivity packages/services/Telephony system/bpf system/core system/netd vendor/lineage vendor/qcom/opensource/power"

# ---- GApps ----
# GApps come from MindTheGapps (gapps option manifest, per branch); a NikGapps zip is only used
# when GAPPS_URL is set. Any override must be an Android 13 package.
# GAPPS_URL=

# ---- build presets: a named set of options, plus the build tag ----
# One build command produces one image. A preset is a saved selection so the combinations you
# actually use do not get retyped; `PRESET=clean ./forge/bootstrap.sh`, or OPTIONS="..." ad hoc.
# Option names come from forge/options/ -- a name with no directory there is an error, not a
# silently ignored word.
# Options every PRESET on this device gets. Keeps the preset rows to what actually differs between
# them. Note this applies to presets only: an ad-hoc OPTIONS="..." replaces the list rather than
# adding to it, so that set is the whole set.
# nav-icons is device-wide on every device: the artwork is this phone's own nav bar, redrawn from
# scratch as vectors rather than extracted, so it is ours to ship and part of the look everywhere,
# not an addition to opt into.
COMMON_OPTIONS="advanced-restart dark-default google-feed-off home-defaults linux livedisplay-off minimal-home nav-icons setup-mobile-data setupwizard-lineage setupwizard-nag-skip teal-skin teal-wallpaper themed-icons"

# clean is bare on purpose: stock LineageOS plus the UI and behaviour options above, no
# third-party apps. libre is the no-Google daily driver -- clean plus F-Droid and Firefox, so
# there is a way to install things without GApps. libre and full both carry the Nextcloud bundle:
# the Robin was sold as the cloud-first phone. full is near the 3072 MB system limit with it
# (~130 MB of headroom); if a Nextcloud update tips it over, the fix is dropping something from
# full, not shrinking the bundle.
# oem is deliberately NOT in any preset: the reclaimed manufacturer assets are a separate
# choice from what apps an image carries. Add them to whichever preset you are building with
# EXTRA_OPTIONS=oem, or once in device.conf.local. The build tag gains -oem automatically, so
# an image holding OEM art can never be mistaken for the shareable one.
# The stock preset takes no options by design. These two words are the exception: without
# setup-mobile-data, Lineage's SetupWizard leaves mobile data off, and an image that comes up
# unable to reach the network is not "a working phone", which is what stock is supposed to prove.
STOCK_OPTIONS="setup-mobile-data"

PRESETS="
  full    tag=turbo         options=gapps,fdroid,k9,kdeconnect,nextcloud,connectbot
  clean   tag=turbo-clean   options=
  libre   tag=turbo-libre   options=fdroid,k9,kdeconnect,nextcloud,connectbot
  robin   tag=turbo-robin   options=oem,root
"

# ro.config.wallpaper points at this file, and WallpaperManager reads it before the framework
# drawable, so this is the wallpaper you actually see on first boot.
DEFAULT_WALLPAPER_FILE=vendor/extra/wallpaper/default_wallpaper.jpg   # staged by teal-wallpaper; device.mk $(wildcard)s it
OEM_ASSET_PACK=nextbit-robin   # reclaim the Robin's own assets (needs Ether_Stock_ROM_*.zip)
VENDORED_PROJECTS="vendored/device_nextbit_ether:device/nextbit/ether vendored/sepolicy-legacy:device/qcom/sepolicy-legacy"
STOCK_ROM_GLOB="Ether_Stock_ROM_*.zip"
WITH_LINUX_CGROUP_PATCH=false    # 3.10 predates kernfs; the symlink patch cannot apply

# ---- release audit exceptions ----
# forge/tools/release.sh refuses to publish a wallpaper it cannot account for. Each hash here is a
# file that was looked at and cleared, with the reason. Never add one to make an error go away.
RELEASE_AUDIT_ALLOW="
  1495a9b4cf3007c8503dffaa2a1c0139e0c0ccf0557b2745a345e57c8e121781  # nebula default_wallpaper.jpg -- a stock LineageOS wallpaper, extracted from LineageOS itself and kept as the default before the teal-shag replaced it. Redistributable: it ships with LineageOS. Present only in images built before that switch.
"
