# option.conf -- see forge/options/README.md
#
# A DIAGNOSTIC option. It changes no product config and ships no app: it only adds kernel
# instrumentation, so a build with it is for debugging and not for release.
NAME=drm-trace
DESC="Diagnostic: kernel trace of whoever disables a DRM plane or CRTC, for a panel that dies while the framework still thinks it is on"
COMPAT=all

# pr_info + dump_stack in drm_atomic_helper_disable_plane and drm_atomic_helper_set_config.
KERNEL_PATCHES="drm-force-disable-trace"
# The patch instruments drm_atomic_helper_disable_plane, so it needs atomic KMS. A pre-atomic
# kernel (the Robin is 3.10) has no such function and the patch cannot apply. Declared optional
# so that costs a warning rather than the build: this option ships no product config, and a
# diagnostic that is merely absent cannot produce a wrong ROM.
KERNEL_PATCHES_OPTIONAL="drm-force-disable-trace"
