# option.conf -- see forge/options/README.md
NAME=connectbot
DESC="ConnectBot: an SSH client with saved hosts, keys and port forwarding"
COMPAT=all

# F-Droid is not optional alongside this. The APK is upstream-signed -- the same
# certificate as the Play Store build -- so Play will update it and take it over. The
# option ships an update-ownership entry naming F-Droid's Privileged Extension to stop
# that, which only means anything if the extension is actually installed; and once Play
# is locked out, something has to deliver updates instead.
REQUIRES=fdroid
