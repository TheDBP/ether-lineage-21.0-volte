# option.conf -- see forge/options/README.md
NAME=setupwizard-lineage
DESC="Use Lineage SetupWizard over Google's (WITH_GAPPS)"
# Patches packages/apps/SetupWizard, and the patch is per-branch because MindTheGapps renames the
# modules it overrides. Only claim the branches that have one: an option with no patch for the
# branch aborts the build rather than skipping, and this sits in COMMON_OPTIONS on ether.
COMPAT=branch=lineage-18.1,branch=lineage-19.1,branch=lineage-20.0
