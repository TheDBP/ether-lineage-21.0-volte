# option.conf -- see forge/options/README.md
#
# root is the first option with HOOKS rather than a makefile fragment. Nothing about it is a
# product-config question: the boot image has to be patched after the build produced it. An option
# is a capability, not specifically a makefile edit, and this is what the other shape looks like.
NAME=root
DESC="Magisk baked into the boot image, so the zip flashes pre-rooted"

# A terminal is most of the point of having root; shipping one without the other is a trap the
# presets kept having to remember. REQUIRES pulls it in wherever root is enabled.
REQUIRES=termoneplus
