# option.conf -- see forge/options/README.md
#
# Bring-up only. It removes adb authorisation for every host, so an image built with it must not be
# distributed. The tag suffix (-bringup) is the marker.
NAME=bringup
DESC="adbd from boot with no authorisation prompt, plus persistent logcat, so a build that never reaches the lock screen can still be traced"
COMPAT=all
