# option.conf -- see forge/options/README.md
NAME=fulguris
DESC="Fulguris as the browser, replacing Jelly"
NOTE="A WebView browser, 9 MB where Fennec stages 320 MB. Mutually exclusive with `firefox`. **In no preset**: it overrides Jelly, so a preset carrying it ships the only browser in the image, and its first run asks you to accept terms with nothing else able to open them"
COMPAT=all
