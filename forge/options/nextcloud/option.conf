# option.conf -- see forge/options/README.md
NAME=nextcloud
DESC="Nextcloud bundle: Files, Talk, NextPush, Deck, NC Passwords, Notes, DAVx5, Tasks -- the current F-Droid build of each"
NOTE="~600 MB against \`nextcloud-core\`'s ~270. Check the partition before adding either"
COMPAT=all

# Bundled from F-Droid and claimed with an update-ownership entry so Play cannot take it
# over. That claim is inert unless the named installer is present, and once Play is shut
# out something has to deliver updates instead.
REQUIRES=fdroid
