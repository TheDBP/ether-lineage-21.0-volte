# option.conf -- see forge/options/README.md
NAME=terminal-visible
DESC="Show the Terminal app in the launcher"
# packages/apps/Terminal does not exist from lineage-20.0 onwards -- LineageOS dropped the app, and
# it is not in the manifest either, so there is nothing to patch. Claiming all branches made a build
# that requested this option abort rather than skip it.
COMPAT=branch=lineage-18.1,branch=lineage-19.1
