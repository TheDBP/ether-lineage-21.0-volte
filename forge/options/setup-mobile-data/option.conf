# option.conf -- see forge/options/README.md
NAME=setup-mobile-data
DESC="Leave mobile data alone during setup (older Lineage turns it off and never back on)"
COMPAT=all

# BRANCH SCOPE: lineage-20.0 only, and deliberately so.
#
# Lineage's SetupWizardApp.onCreate() called setMobileDataEnabled(this, false) unconditionally for
# the owner and nothing ever turned it back on -- finishSetupWizard() sets DEVICE_PROVISIONED and
# USER_SETUP_COMPLETE but not this, and there is no mobile-data page in the wizard. A fresh install
# finished setup with mobile data off and nothing to explain why.
#
# Upstream has since fixed it: on lineage-22.2 SetupWizardApp.java has no setMobileDataEnabled call
# at all, and on lineage-24.0 the file does not exist. So there is nothing to patch on the newer
# branches, and because this option contributes only patches, enabling it there is a HARD ERROR in
# apply-overlay.sh rather than a silent skip. Do not add it to COMMON_OPTIONS in the device
# template. Enable it per-device, on a branch that still has the bug.
