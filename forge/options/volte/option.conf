# option.conf -- see forge/options/README.md
#
# volte is the second option with a real INPUT (oem was the first), and the demanding one: it needs
# the phone's own stock firmware. An OEM IMS stack cannot be built from source because there is no
# source -- the method is to take the manufacturer's IMS app, framework jars and native libraries
# out of the firmware the phone shipped with and rework them onto a modern platform.
#
# The option installs nothing itself. Which packages make up IMS is device-specific, so the device
# tree gates those on WITH_VOLTE; this option stages the rework (post-patch.sh -> the device's
# VOLTE_STAGE_SCRIPT) and refuses to let a build claiming VoLTE start without it (require.sh).
#
# device.conf supplies all three device-specific parts: VOLTE_STOCK_GLOB, VOLTE_STAGE_SCRIPT,
# VOLTE_STAGED_MARKER. bootstrap.sh turns this option on by itself when the stock input is present
# -- see "volte" there for why it is a default rather than an opt-in.
NAME=volte
DESC="The manufacturer's own IMS stack, rebuilt from its stock firmware, so the phone can place calls over LTE"
NOTE="Turns itself on when the phone's stock firmware is present and off when it is not, marking the build tag `-novolte` -- see `forge/options/volte/README.md`"
