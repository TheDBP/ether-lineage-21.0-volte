# option.conf -- see forge/options/README.md
#
# linux is the first option that contributes to the KERNEL rather than to product config. It needs
# kernel config fragments and, on kernels new enough to take it, a kernel patch -- so option.conf
# carries KERNEL_CONFIGS and KERNEL_PATCHES, which apply-overlay folds into the same lists a device
# can set directly in device.conf.
NAME=linux
DESC="On-device Linux environment (chroot + Docker): container kernel config and cgroup fixes"
COMPAT=all

# Namespaces, cgroups, overlayfs, veth -- what a container runtime needs from the kernel.
KERNEL_CONFIGS="container"

# cgroup symlinks without the name= prefix. Needs kernfs, so it is absent on kernels older than 3.14
# -- the Robin's 3.10 cannot take it. A device opts out with WITH_LINUX_CGROUP_PATCH=false.
KERNEL_PATCHES="cgroup-noprefix-symlinks"
