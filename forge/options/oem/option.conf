# option.conf -- see forge/options/README.md
#
# oem is the first option with a real INPUT: it needs a copy of the phone's own stock firmware, and
# a pack that understands that firmware's layout. The option installs whatever was extracted; the
# pack knows how to extract it. OEM_ASSET_PACK in device.conf picks the pack.
NAME=oem
DESC="The manufacturer's own boot animation, wallpapers and sounds, reclaimed from its stock ROM"
NOTE="Needs that phone's own stock ROM and a pack that understands its layout -- see `forge/docs/OEM-ASSETS.md`"
